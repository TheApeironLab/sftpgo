name: Chentu file browser image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build static ARM64 binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags 'nogcs,noazblob,nosqlite' -trimpath -ldflags '-s -w' -o sftpgo .
      - name: Prepare CA bundle
        run: cp /etc/ssl/certs/ca-certificates.crt ca-certificates.crt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chentu
          platforms: linux/arm64
          push: true
          provenance: true
          tags: ghcr.io/theapeironlab/sftpgo:2.7.6-chentu-pkce.1
          labels: |
            org.opencontainers.image.source=https://github.com/TheApeironLab/sftpgo
            org.opencontainers.image.revision=${{ github.sha }}
