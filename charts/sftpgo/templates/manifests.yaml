{{- if not (has .Values.auth.mode (list "external" "oidc")) -}}
{{- fail "auth.mode must be external or oidc" -}}
{{- end -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: files-data}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests: {storage: {{ .Values.storage }}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: files}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: files}
  template:
    metadata:
      labels: {app: files}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext: {fsGroup: 1000}
      automountServiceAccountToken: false
      imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
      containers:
{{- if eq .Values.auth.mode "oidc" }}
        - name: identity-projection
          image: {{ required "provisioner.image is required for managed OIDC" .Values.provisioner.image | quote }}
          securityContext: {runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false}
          env:
            - {name: SSO_TENANT, value: {{ required "auth.oidc.tenant is required" .Values.auth.oidc.tenant | quote }}}
            - {name: SSO_CLIENT_ID, value: {{ required "auth.oidc.clientId is required" .Values.auth.oidc.clientId | quote }}}
            - {name: S3_ENDPOINT, value: {{ required "provisioner.s3Endpoint is required" .Values.provisioner.s3Endpoint | quote }}}
            - {name: S3_REGION, value: {{ .Values.provisioner.s3Region | quote }}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/sftpgo}
            - {name: chentu-ca, mountPath: /etc/chentu-ca, readOnly: true}
            - {name: directory-credentials, mountPath: /run/sso/directory, readOnly: true}
            - {name: admin-credentials, mountPath: /run/sso/admin, readOnly: true}
            - {name: storage-credentials, mountPath: /run/sso/storage, readOnly: true}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            exec: {command: [python3, /opt/files-sso/sync.py, ready]}
            periodSeconds: 5
{{- end }}
        - name: files
          image: {{ required "files image is required" .Values.image | quote }}
          args: [serve, --config-dir, /etc/sftpgo, --log-level, info]
          securityContext: {runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false}
          env:
            - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/chentu-ca"}
            - {name: SFTPGO_SFTPD__BINDINGS__0__PORT, value: "0"}
            - {name: SFTPGO_DATA_PROVIDER__DRIVER, value: bolt}
            - {name: SFTPGO_DATA_PROVIDER__NAME, value: /var/lib/sftpgo/files.db}
            - {name: SFTPGO_DATA_PROVIDER__USERS_BASE_DIR, value: /var/lib/sftpgo/homes}
            - {name: SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN, value: "true"}
            - {name: SFTPGO_DEFAULT_ADMIN_USERNAME, value: automation}
            - name: SFTPGO_DEFAULT_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.adminSecret }}, key: password}}
            - {name: SFTPGO_HTTPD__BINDINGS__0__PORT, value: "8080"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN, value: "false"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_REST_API, value: "false"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__DISABLED_LOGIN_METHODS, value: "9"}
            - name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ default "files-oidc" .Values.auth.oidc.existingSecret }}, key: client-id}}
            - name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ default "files-oidc" .Values.auth.oidc.existingSecret }}, key: client-secret}}
            - name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CONFIG_URL
              valueFrom: {secretKeyRef: {name: {{ default "files-oidc" .Values.auth.oidc.existingSecret }}, key: issuer}}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__REDIRECT_BASE_URL, value: {{ default (printf "https://files.%s" (default .Values.domain .Values.publicDomain)) .Values.publicUrl | quote }}}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__USERNAME_FIELD, value: sub}
            - {name: SFTPGO_HTTPD__BINDINGS__0__SECURITY__ENABLED, value: "true"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__SECURITY__CONTENT_SECURITY_POLICY, value: {{ printf "frame-ancestors %s" .Values.frameAncestors | quote }}}
            - {name: SFTPGO_HTTPD__BINDINGS__1__PORT, value: "8081"}
            - {name: SFTPGO_HTTPD__BINDINGS__1__ADDRESS, value: "127.0.0.1"}
            - {name: SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_ADMIN, value: "false"}
            - {name: SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_CLIENT, value: "false"}
            - {name: SFTPGO_HTTPD__BINDINGS__1__ENABLE_REST_API, value: "true"}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 30}
          volumeMounts:
            - {name: data, mountPath: /var/lib/sftpgo}
            - {name: temporary, mountPath: /tmp}
            - {name: chentu-ca, mountPath: /etc/chentu-ca, readOnly: true}
      volumes:
{{- if eq .Values.auth.mode "oidc" }}
        - name: directory-credentials
          secret: {secretName: {{ required "auth.oidc.directorySecret is required" .Values.auth.oidc.directorySecret }}}
        - name: admin-credentials
          secret: {secretName: {{ .Values.adminSecret }}}
        - name: storage-credentials
          secret: {secretName: {{ .Values.provisioner.existingSecret }}}
{{- end }}
        - {name: temporary, emptyDir: {sizeLimit: 1Gi}}
        - {name: data, persistentVolumeClaim: {claimName: files-data}}
        - {name: chentu-ca, configMap: {name: {{ .Values.caConfigMap }}}}
---
apiVersion: v1
kind: Service
metadata: {name: files}
spec:
  selector: {app: files}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: files
  annotations: {cert-manager.io/cluster-issuer: chentu-internal-ca}
spec:
  ingressClassName: traefik
  tls: [{hosts: [{{ default (printf "files.%s" .Values.domain) .Values.ingress.host }}], secretName: files-tls}]
  rules:
    - host: {{ default (printf "files.%s" .Values.domain) .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: files, port: {number: 8080}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: files}
spec:
  podSelector: {matchLabels: {app: files}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: TCP, port: 8080}]
